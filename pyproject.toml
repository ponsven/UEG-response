[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "UEG_response"
version = "0.0.1"
authors = [
  { name="Pontus Svensson", email="p.svensson@hzdr.de" },
]
description = "Implementations of approximations to the linear and nonlinear response functions for the Uniform Electron Gas (UEG)."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  'numpy',
  'scipy',
  'numba',
  'fdint',
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/ponsven/UEG-response"
Issues = "https://github.com/ponsven/UEG-response/issues"